@if (store.stats(); as stats) {
  <ul class="flex items-center justify-between gap-2" aria-label="Your stats">
    <li title="Current course">
      <app-tech-logo [tech]="stats.courseId" [size]="30" label="Current course" />
    </li>
    <li class="stat" [title]="stats.streak + ' day streak'">
      <span [class]="stats.activitiesToday ? 'text-streak' : 'text-muted'">{{ stats.streak }}</span>
      <app-nav-art name="flame" [size]="24" [muted]="!stats.activitiesToday" />
      <span class="sr-only">day streak</span>
    </li>
    <li class="stat" [title]="stats.gems + ' gems'">
      <span class="text-xp">{{ stats.gems }}</span>
      <app-nav-art name="gem" [size]="24" />
      <span class="sr-only">gems</span>
    </li>
    <li class="stat" [title]="stats.energy + ' energy'">
      <span class="text-ai">{{ stats.energy }}</span>
      <app-nav-art name="energy" [size]="24" />
      <span class="sr-only">energy</span>
    </li>
  </ul>
} @else {
  <div class="h-8 animate-pulse rounded-btn bg-surface"></div>
}
