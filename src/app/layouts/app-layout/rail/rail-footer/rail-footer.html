<ul class="flex flex-wrap justify-center gap-x-3 gap-y-1.5">
  @for (link of links; track link.label) {
    <li>
      <a [routerLink]="link.path" class="text-sm text-muted hover:text-text">{{ link.label }}</a>
    </li>
  }
</ul>
<ul class="mt-4 flex justify-center gap-3">
  @for (social of socials; track social.label) {
    <li>
      <span class="text-muted" [attr.title]="social.label">
        <app-icon [name]="social.icon" [size]="18" [label]="social.label" />
      </span>
    </li>
  }
</ul>
