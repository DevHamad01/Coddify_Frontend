<div class="flex">
  <ul class="w-48 shrink-0 border-r border-border p-3" aria-label="Resource groups">
    @for (group of groups; track group.id) {
      <li>
        <button
          type="button"
          class="group-tab"
          [class.is-active]="active() === group.id"
          [attr.aria-pressed]="active() === group.id"
          (mouseenter)="active.set(group.id)"
          (focus)="active.set(group.id)"
        >
          {{ group.label }}
        </button>
      </li>
    }
  </ul>

  <ul class="grid min-w-0 flex-1 grid-cols-2 gap-x-4 gap-y-1 p-4">
    @for (link of links(); track link.label) {
      <li>
        <a [routerLink]="link.path" [fragment]="link.fragment" class="resource">
          @if (link.icon) {
            <app-icon [name]="link.icon" [size]="20" class="mt-0.5 text-muted" />
          }
          <span>
            <span class="block font-display font-bold text-text">{{ link.label }}</span>
            <span class="block text-[13px] leading-5 text-muted">{{ link.description }}</span>
          </span>
        </a>
      </li>
    }
  </ul>
</div>
