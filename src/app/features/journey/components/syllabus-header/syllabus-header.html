<div class="flex items-start justify-between gap-4">
  <div class="min-w-0">
    <p class="text-sm text-muted">
      <a routerLink="/app/journey" class="font-semibold text-primary hover:underline">Syllabus</a>
      <app-icon name="chevron-right" [size]="12" class="mx-1 align-middle" />
      {{ journey().courseName }} · Section {{ journey().sectionNumber }} · Chapter
      {{ chapter().number }}
    </p>
    <h1 class="mt-1 font-display text-2xl font-bold">{{ chapter().title }}</h1>
  </div>
  <div class="flex shrink-0 flex-col items-end gap-2">
    <button type="button" class="chip-button" (click)="search.open()">
      <app-icon name="search" [size]="14" /> Ctrl K
    </button>
    <a routerLink="/resources/cheat-sheets" class="chip-button">
      <app-icon name="file-text" [size]="14" /> Cheat sheet
    </a>
  </div>
</div>

<div class="mt-4 flex items-center gap-3">
  <app-icon name="target" [size]="20" class="text-info" />
  <div
    class="flex flex-1 gap-1.5"
    [attr.aria-label]="done() + ' of ' + segments().length + ' done'"
  >
    @for (node of segments(); track node.id) {
      <span class="segment" [class.is-done]="node.state === 'completed'"></span>
    }
  </div>
  <span class="font-display text-sm font-bold text-info"
    >{{ done() }} / {{ segments().length }}</span
  >
</div>
