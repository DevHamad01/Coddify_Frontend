@if (node().state === 'current' && !selected()) {
  <span class="start-bubble" aria-hidden="true">Start</span>
}
<button
  type="button"
  class="node"
  [attr.data-state]="node().state"
  [attr.data-kind]="node().kind"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="selected()"
  (click)="pressed.emit()"
>
  <svg class="shape" viewBox="0 0 72 68" width="72" height="68" aria-hidden="true">
    <!-- Side wall: the darker base the face sits on. -->
    <path class="side" [attr.d]="sidePath" />
    <g class="face">
      <path class="top" [attr.d]="topPath" />
      <!-- Head: the inset plate that holds the icon. -->
      <path class="head" [attr.d]="headPath" transform="translate(7 8)" />
      <path class="shine" d="M24 12.5 Q36 8 48 12.5" />
    </g>
  </svg>
  <span class="glyph">
    @if (node().kind === 'chest' && node().state !== 'completed') {
      <app-nav-art name="chest" [size]="30" [muted]="node().state === 'locked'" />
    } @else {
      <app-icon [name]="icon()" [size]="24" [strokeWidth]="node().state === 'completed' ? 3.2 : 2.4" />
    }
  </span>
</button>
