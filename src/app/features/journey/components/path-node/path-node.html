@if (node().state === 'current' && !selected()) {
  <span class="start-bubble" aria-hidden="true">Start</span>
}
<button
  type="button"
  class="node"
  [attr.data-state]="node().state"
  [attr.data-kind]="node().kind"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="selected()"
  (click)="pressed.emit()"
>
  <svg class="shape" viewBox="0 -12 72 80" width="72" height="80" aria-hidden="true">
    <!-- Bottom tier: a static plinth. -->
    <path class="base-side" [attr.d]="sidePath" />
    <path class="base-top" [attr.d]="topPath" />
    <!-- Top tier: same shape, smaller; its face is the button that sinks onto its own wall. -->
    <path class="cap-side" [attr.d]="headPath" transform="translate(7 4)" />
    <g class="cap">
      <path class="cap-top" [attr.d]="headPath" transform="translate(7 -8)" />
      <path class="shine" d="M24 -2.5 Q36 -7 48 -2.5" />
    </g>
  </svg>
  <span class="glyph">
    @if (node().kind === 'chest' && node().state !== 'completed') {
      <app-nav-art name="chest" [size]="30" [muted]="node().state === 'locked'" />
    } @else {
      <app-icon [name]="icon()" [size]="24" [strokeWidth]="node().state === 'completed' ? 3.2 : 2.4" />
    }
  </span>
</button>
