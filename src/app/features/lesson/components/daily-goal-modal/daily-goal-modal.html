<div class="backdrop" aria-hidden="true"></div>
<div role="dialog" aria-modal="true" aria-labelledby="goal-title" class="card">
  <h2 id="goal-title" class="font-display text-xl font-bold">
    How far do you want to go each day?
  </h2>
  <p class="mt-1 text-sm text-muted">Choose a daily goal. You can change it anytime.</p>

  <div class="mt-4 flex flex-col gap-3" role="radiogroup" aria-labelledby="goal-title">
    @for (option of options; track option.value) {
      <button
        type="button"
        role="radio"
        class="option"
        [attr.aria-checked]="selected() === option.value"
        (click)="selected.set(option.value)"
      >
        <span class="radio">
          @if (selected() === option.value) {
            <app-icon name="check" [size]="14" [strokeWidth]="3" />
          }
        </span>
        <span class="flex-1 text-left">
          <span class="block font-display text-lg font-bold">{{ option.value }} activities</span>
          <span class="block text-sm text-muted">{{ option.label }}</span>
        </span>
        @if ('recommended' in option) {
          <span class="badge">Recommended</span>
        }
      </button>
    }
  </div>

  @if (activitiesToday() > 0) {
    <p class="mt-4 text-center font-semibold text-info">
      You're already {{ activitiesToday() }} of {{ selected() }} complete today
    </p>
  }

  <button
    appButton
    [block]="true"
    class="mt-4 uppercase"
    [loading]="saving()"
    (click)="chosen.emit(selected())"
  >
    Set my goal
  </button>
  <button type="button" class="mt-3 w-full py-2 font-semibold text-primary" (click)="later.emit()">
    Decide later
  </button>
</div>
