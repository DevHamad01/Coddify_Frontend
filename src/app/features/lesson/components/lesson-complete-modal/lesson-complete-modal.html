<div class="backdrop" aria-hidden="true"></div>
<div role="dialog" aria-modal="true" aria-labelledby="complete-title" class="card">
  <div class="flex flex-wrap justify-center gap-2">
    @if (reward().streakIncreased) {
      <span class="chip text-streak"
        ><app-nav-art name="flame" [size]="16" /> Your streak is up!</span
      >
    }
    @if (reward().firstTry) {
      <span class="chip text-muted"><app-icon name="target" [size]="15" /> First try</span>
    }
  </div>

  <h2 id="complete-title" class="mt-3 text-center font-display text-2xl font-bold">
    Lesson Complete!
  </h2>

  <div class="mt-4 grid grid-cols-3 gap-2">
    <div class="stat">
      <p class="stat-label">Total XP</p>
      <p class="stat-value text-info">{{ reward().xpEarned }} XP</p>
    </div>
    <div class="stat">
      <p class="stat-label">Brilliant!</p>
      <p class="stat-value text-xp">
        {{ reward().gemsEarned }} <app-nav-art name="gem" [size]="18" />
      </p>
    </div>
    <div class="stat">
      <p class="stat-label">Energy</p>
      <p class="stat-value text-ai">FREE</p>
    </div>
  </div>

  <p class="mt-4 text-center text-sm text-muted">
    <strong class="text-text">{{ lessonTitle() }}</strong> wrapped up. You're making strides in
    <strong class="text-text">{{ chapterTitle() }}</strong
    >!
  </p>

  <button appButton [block]="true" class="mt-5 uppercase" (click)="continued.emit()">
    Continue
  </button>
</div>
