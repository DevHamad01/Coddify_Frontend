<h2 class="sr-only">Courses you can take</h2>
@for (row of rows; track $index) {
  <div
    class="group overflow-hidden [mask-image:linear-gradient(to_right,transparent,black_6%,black_94%,transparent)]"
  >
    <ul class="track" [class.is-reverse]="row.reverse">
      @for (copy of copies; track copy) {
        @for (tech of row.techs; track tech.id) {
          <li [attr.aria-hidden]="copy > 0 ? 'true' : null">
            <a
              routerLink="/register"
              [queryParams]="{ lang: tech.id }"
              [tabIndex]="copy > 0 ? -1 : 0"
              class="tech-chip"
            >
              <app-tech-logo [tech]="tech.id" [size]="24" />
              {{ tech.name }}
            </a>
          </li>
        }
      }
    </ul>
  </div>
}
