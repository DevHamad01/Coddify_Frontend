<div class="container-page relative flex flex-col items-center pt-12 text-center sm:pt-16">
  <h1 class="hero-title text-balance">Learn to code for free</h1>
  <p class="mt-4 text-lg text-muted sm:text-xl">
    Together with
    <strong class="font-bold text-text" [appCountUp]="stats.learners"></strong> learners in
    <strong class="font-bold text-text" [appCountUp]="stats.countries"></strong> countries
  </p>

  <a appButton size="lg" routerLink="/onboarding" class="mt-8 w-full max-w-md uppercase">
    Get started
  </a>
  <p class="mt-4 text-[15px] text-muted">
    Already have an account?
    <a routerLink="/login" class="font-bold text-primary hover:underline">Log in</a>
  </p>
  <ul class="mt-3 flex flex-wrap justify-center gap-x-4 gap-y-1 text-sm text-muted">
    <li class="flex items-center gap-1.5">
      <app-icon name="check-circle" [size]="15" class="text-success" />Free forever plan
    </li>
    <li class="flex items-center gap-1.5">
      <app-icon name="check-circle" [size]="15" class="text-success" />Runs in your browser
    </li>
  </ul>
</div>

<!-- Globe stage: the robot peeks over the rim while learners light up around the world -->
<div class="globe-stage">
  <app-globe class="absolute inset-0" [pings]="pings" [top]="globeTop" />
  <app-mascot
    pose="peeking"
    [size]="robotSize"
    class="robot"
    [style.top.px]="robotTop"
    label="Bit the Coddify robot peeking over the globe"
  />
</div>

<app-language-marquee />
