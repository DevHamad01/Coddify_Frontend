<app-feature-split
  [band]="true"
  [reverse]="true"
  eyebrow="Certificates"
  heading="Finish a course and earn proof"
  lead="Every completed course comes with a certificate and a public verification link, ready for your CV, LinkedIn or your next internship application."
>
  <ul copy class="flex flex-col gap-3 text-[15px] text-muted">
    @for (point of points; track point) {
      <li class="flex items-center gap-2.5">
        <app-icon name="check-circle" [size]="18" class="text-success" />{{ point }}
      </li>
    }
  </ul>

  <!-- A small stack of earned certificates: two peek out from behind the front one -->
  <div visual class="stack" aria-label="Example certificates" role="img">
    @for (back of backs; track back.course) {
      <div class="back-card" [class]="back.position">
        <span class="back-band" [style.background]="back.color"></span>
        <div class="flex items-center gap-2">
          <app-tech-logo [tech]="back.tech" [size]="20" />
          <span class="font-display text-sm font-bold">{{ back.course }}</span>
        </div>
        <p class="mt-3 text-[9px] font-bold uppercase tracking-[0.2em] text-muted">
          Certificate of completion
        </p>
        <span class="mt-4 block h-2 w-3/4 rounded-full bg-surface"></span>
        <span class="mt-2 block h-2 w-1/2 rounded-full bg-surface"></span>
        <app-icon name="award" [size]="22" class="absolute bottom-4 right-4 text-xp/70" />
      </div>
    }
    <div class="front-card">
      <span
        class="absolute left-3 top-3 h-6 w-6 rounded-tl-lg border-l-2 border-t-2 border-xp/70"
      ></span>
      <span
        class="absolute right-3 top-3 h-6 w-6 rounded-tr-lg border-r-2 border-t-2 border-xp/70"
      ></span>
      <span
        class="absolute bottom-3 left-3 h-6 w-6 rounded-bl-lg border-b-2 border-l-2 border-xp/70"
      ></span>
      <span
        class="absolute bottom-3 right-3 h-6 w-6 rounded-br-lg border-b-2 border-r-2 border-xp/70"
      ></span>

      <app-icon name="award" [size]="36" class="text-xp" />
      <p class="mt-2 text-[11px] font-bold uppercase tracking-[0.2em] text-muted">
        Certificate of completion
      </p>
      <p class="mt-5 text-sm italic text-muted">This certifies that</p>
      <p
        class="mx-auto mt-1 w-fit border-b-2 border-xp/40 px-4 pb-1 font-display text-2xl font-bold"
      >
        Ayesha Khan
      </p>
      <p class="mt-3 text-sm italic text-muted">has successfully completed</p>
      <div class="mt-3 inline-flex items-center gap-2 rounded-full bg-surface-2 px-3 py-1.5">
        <app-language-badge [language]="python" [size]="22" />
        <span class="font-display text-sm font-bold">Python Foundations</span>
      </div>
      <div class="mt-7 flex items-end justify-between text-left">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-wider text-muted">Issued</p>
          <p class="text-sm font-semibold">Oct 2026</p>
        </div>
        <app-chip tone="primary" icon="check">Verified</app-chip>
      </div>
    </div>
  </div>
</app-feature-split>
