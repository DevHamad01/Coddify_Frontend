<div class="flex items-center justify-between">
  <h2 class="font-display text-xl font-bold">Interview day</h2>
  <button
    type="button"
    class="text-sm font-semibold text-primary hover:underline"
    (click)="editing.set(!editing())"
  >
    {{ date() ? 'Change' : 'Set a date' }}
  </button>
</div>

@if (editing()) {
  <div class="mt-3 flex gap-2">
    <input
      #picker
      type="date"
      class="h-10 flex-1 rounded-btn border border-border bg-bg px-3 text-sm text-text [color-scheme:dark]"
      aria-label="Interview date"
      [min]="today"
      [value]="date() ?? ''"
    />
    <button type="button" class="save" (click)="save(picker.value)">Save</button>
  </div>
} @else if (date(); as date) {
  <p class="mt-2 text-[15px]">
    <span class="font-bold text-primary">{{ daysLeft(date) }} days</span> left until
    {{ date | date: 'MMM d, y' }}. Your plan is paced for it.
  </p>
} @else {
  <p class="mt-2 text-[15px] text-muted">Add your interview date and we pace the plan to it.</p>
}
