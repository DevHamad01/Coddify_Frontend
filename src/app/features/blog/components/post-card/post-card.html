<a [routerLink]="['/blog', post().slug]" class="card">
  <app-post-cover [cover]="post().cover" class="h-44" />
  <div class="flex flex-1 flex-col p-5">
    <p class="text-xs font-semibold text-primary">{{ post().category }}</p>
    <h3 class="mt-2 text-lg font-bold leading-snug">{{ post().title }}</h3>
    <p class="mt-2 line-clamp-3 text-sm leading-6 text-muted">{{ post().excerpt }}</p>
    <p class="mt-auto pt-4 text-xs text-muted">
      {{ post().author }} · <time [attr.datetime]="post().date">{{ date() }}</time> ·
      {{ post().readMinutes }} min read
    </p>
  </div>
</a>
