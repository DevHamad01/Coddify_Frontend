@if (registered(); as done) {
  <app-auth-shell heading="Check your inbox" pose="celebrating" panelHeading="Almost there!">
    <app-check-inbox
      [email]="done.email"
      [demoToken]="done.debugVerificationToken ?? null"
      message="We sent a verification link to"
    />
  </app-auth-shell>
} @else {
  <app-auth-shell
    heading="Create your free account"
    subheading="Five minutes a day is all it takes."
    [showTabs]="true"
    pose="celebrating"
  >
    <app-google-button label="Sign up with Google" />

    <div class="my-5 flex items-center gap-3 text-xs font-semibold uppercase tracking-wider text-muted">
      <span class="h-px flex-1 bg-border"></span>or<span class="h-px flex-1 bg-border"></span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
      @if (serverError(); as err) {
        <app-alert [message]="err.message">
          @if (err.code === 'email_taken') {
            <a routerLink="/login" class="mt-1 inline-block font-semibold text-primary hover:underline">Log in instead</a>
          }
        </app-alert>
      }

      <app-input
        label="Full name"
        icon="user"
        autocomplete="name"
        placeholder="Ayesha Khan"
        formControlName="fullName"
        [required]="true"
        [error]="error('fullName')"
      />
      <app-input
        label="Email"
        type="email"
        icon="mail"
        autocomplete="email"
        placeholder="you@example.com"
        formControlName="email"
        [required]="true"
        [error]="error('email')"
      />
      <app-input
        label="Password"
        type="password"
        icon="lock"
        autocomplete="new-password"
        formControlName="password"
        [required]="true"
        [error]="error('password')"
      >
        <app-password-strength-meter [password]="password()" />
      </app-input>
      <app-input
        label="Confirm password"
        type="password"
        icon="lock"
        autocomplete="new-password"
        formControlName="confirmPassword"
        [required]="true"
        [error]="error('confirmPassword')"
      />
      <app-checkbox formControlName="terms" [error]="error('terms')">
        I agree to the <a routerLink="/terms" class="font-semibold text-primary hover:underline">Terms of use</a>
        and <a routerLink="/privacy" class="font-semibold text-primary hover:underline">Privacy policy</a>.
      </app-checkbox>

      <button appButton type="submit" [block]="true" [loading]="pending()" loadingLabel="Creating account">
        Create account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-muted">
      Already have an account?
      <a routerLink="/login" class="font-semibold text-primary hover:underline">Log in</a>
    </p>
  </app-auth-shell>
}
