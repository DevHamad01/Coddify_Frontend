<button
  appButton
  type="button"
  variant="secondary"
  [block]="true"
  [loading]="pending()"
  (click)="signIn()"
>
  @if (!pending()) {
    <span
      class="flex h-6 w-6 items-center justify-center rounded-full border border-border font-display text-sm font-extrabold"
      aria-hidden="true"
      >G</span
    >
  }
  {{ label() }}
</button>
