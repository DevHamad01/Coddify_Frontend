@if (done()) {
  <app-auth-shell heading="Password updated" pose="celebrating" panelHeading="You are all set">
    <div class="flex flex-col items-center gap-5 text-center">
      <p class="text-muted">Your new password is saved. Log in with it to pick up where you left off.</p>
      <a appButton routerLink="/login" [block]="true">Log in</a>
    </div>
  </app-auth-shell>
} @else if (!linkIsValid()) {
  <app-auth-shell heading="This link does not work" pose="thinking" panelHeading="Let's get you a fresh link">
    <div class="flex flex-col gap-5">
      <app-alert message="The reset link is incomplete or has expired. Request a new one and use the latest email." />
      <a appButton routerLink="/forgot-password" [block]="true">Request a new link</a>
    </div>
  </app-auth-shell>
} @else {
  <app-auth-shell
    heading="Choose a new password"
    [subheading]="'For ' + email()"
    pose="thinking"
    panelHeading="Fresh start, same streak"
  >
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
      @if (serverError(); as err) {
        <app-alert [message]="err.message">
          @if (err.code === 'invalid_token' || err.code === 'token_expired') {
            <a routerLink="/forgot-password" class="mt-1 inline-block font-semibold text-primary hover:underline">
              Request a new link
            </a>
          }
        </app-alert>
      }
      <app-input
        label="New password"
        type="password"
        icon="lock"
        autocomplete="new-password"
        formControlName="password"
        [required]="true"
        [error]="passwordError()"
      >
        <app-password-strength-meter [password]="password()" />
      </app-input>
      <app-input
        label="Confirm new password"
        type="password"
        icon="lock"
        autocomplete="new-password"
        formControlName="confirmPassword"
        [required]="true"
        [error]="confirmError()"
      />
      <button appButton type="submit" [block]="true" [loading]="pending()" loadingLabel="Saving password">
        Save new password
      </button>
    </form>
  </app-auth-shell>
}
