@if (dialog.isOpen()) {
  <div class="backdrop" aria-hidden="true" (click)="dialog.close()"></div>
  <div role="dialog" aria-modal="true" aria-label="Search" class="panel">
    <div class="flex items-center gap-3 border-b border-border px-4">
      <app-icon name="search" class="text-muted" />
      <input
        #input
        type="search"
        class="h-14 flex-1 bg-transparent text-[16px] text-text outline-none placeholder:text-muted"
        placeholder="Search courses and pages"
        aria-label="Search courses and pages"
        role="combobox"
        aria-controls="search-results"
        [attr.aria-activedescendant]="results().length ? 'search-result-' + activeIndex() : null"
        aria-expanded="true"
        [value]="query()"
        (input)="onQuery(input.value)"
        (keydown)="onInputKey($event)"
      />
      <kbd class="kbd">Esc</kbd>
    </div>

    <ul id="search-results" role="listbox" class="max-h-[60vh] overflow-y-auto p-2">
      @for (item of results(); track item.id; let i = $index) {
        <li
          [id]="'search-result-' + i"
          role="option"
          [attr.aria-selected]="i === activeIndex()"
          class="result"
          (mouseenter)="activeIndex.set(i)"
          (click)="go(item)"
        >
          <span class="result-icon">
            @if (item.tech) {
              <app-tech-logo [tech]="item.tech" [size]="22" />
            } @else if (item.icon) {
              <app-icon [name]="item.icon" [size]="18" />
            }
          </span>
          <span class="min-w-0 flex-1">
            <span class="block font-semibold text-text">{{ item.label }}</span>
            <span class="block text-xs text-muted">{{ item.hint }}</span>
          </span>
          <span class="text-xs text-muted">{{ item.group }}</span>
        </li>
      } @empty {
        <li class="px-3 py-8 text-center text-sm text-muted">No results for "{{ query() }}"</li>
      }
    </ul>
  </div>
}
