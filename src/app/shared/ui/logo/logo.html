@if (link()) {
  <a
    routerLink="/"
    class="inline-flex items-center gap-2 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary"
    aria-label="Coddify home"
  >
    <ng-container *ngTemplateOutlet="mark" />
  </a>
} @else {
  <span class="inline-flex items-center gap-2"><ng-container *ngTemplateOutlet="mark" /></span>
}
<ng-template #mark>
  <svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true">
    <rect width="40" height="40" rx="11" fill="#14B8A6" />
    <rect x="18" y="3" width="4" height="5" rx="2" fill="#CCFBF1" />
    <rect x="8" y="7" width="24" height="25" rx="11" fill="#F4F2FC" />
    <rect x="11" y="13" width="18" height="12" rx="5" fill="#17142B" />
    <rect x="15" y="16" width="3" height="6" rx="1.5" fill="#C9A6FF" />
    <rect x="22" y="16" width="3" height="6" rx="1.5" fill="#C9A6FF" />
    <circle cx="8" cy="19" r="3.6" fill="#7FD4FF" stroke="#F4F2FC" stroke-width="1.6" />
    <circle cx="32" cy="19" r="3.6" fill="#7FD4FF" stroke="#F4F2FC" stroke-width="1.6" />
  </svg>
  @if (showWordmark()) {
    <span class="font-display text-xl font-extrabold tracking-tight text-text">
      Codd<span class="text-primary">ify</span>
    </span>
  }
</ng-template>
