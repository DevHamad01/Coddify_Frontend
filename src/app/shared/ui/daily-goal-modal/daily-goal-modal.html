<div class="backdrop" aria-hidden="true"></div>
<div role="dialog" aria-modal="true" aria-labelledby="goal-title" class="card">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h2 id="goal-title" class="font-display text-xl font-bold">Daily activity goal</h2>
      <p class="mt-1 text-sm text-muted">Choose how many activities you want to complete each day.</p>
    </div>
    <button type="button" class="close" aria-label="Close" (click)="later.emit()">
      <app-icon name="x" [size]="18" />
    </button>
  </div>

  <div class="mt-4 grid grid-cols-2 gap-2.5" role="radiogroup" aria-labelledby="goal-title">
    @for (option of options; track option.value) {
      <button
        type="button"
        role="radio"
        class="option"
        [attr.aria-checked]="selected() === option.value"
        (click)="selected.set(option.value)"
      >
        <span class="radio">
          @if (selected() === option.value) {
            <app-icon name="check" [size]="14" [strokeWidth]="3" />
          }
        </span>
        <span class="flex-1 text-left">
          <span class="block font-display font-bold">{{ option.value }} activities</span>
          <span class="block text-xs text-muted">
            {{ option.label }}
            @if ('recommended' in option) {
              · <span class="font-bold text-primary">Recommended</span>
            }
          </span>
        </span>
      </button>
    }
  </div>

  @if (activitiesToday() > 0) {
    <p class="mt-4 text-center font-semibold text-info">
      You're already {{ activitiesToday() }} of {{ selected() }} complete today
    </p>
  }

  <div class="mt-5 flex items-center justify-end gap-3">
    @if (current() !== null) {
      <button type="button" class="mr-auto font-semibold text-danger" (click)="removed.emit()">
        Remove daily goal
      </button>
    } @else {
      <button type="button" class="mr-auto font-semibold text-muted" (click)="later.emit()">
        Decide later
      </button>
    }
    <button appButton class="uppercase" [loading]="saving()" (click)="chosen.emit(selected())">
      Save goal
    </button>
  </div>
</div>
