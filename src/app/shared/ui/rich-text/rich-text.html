@for (segment of segments(); track $index) {
  @switch (segment.kind) {
    @case ('bold') {
      <strong class="font-bold text-text">{{ segment.text }}</strong>
    }
    @case ('code') {
      <code class="inline-code">{{ segment.text }}</code>
    }
    @case ('italic') {
      <em>{{ segment.text }}</em>
    }
    @default {
      {{ segment.text }}
    }
  }
}
