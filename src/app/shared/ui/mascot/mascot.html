<svg
  viewBox="0 0 120 140"
  [attr.width]="size()"
  [attr.height]="size() * (140 / 120)"
  role="img"
  [attr.aria-label]="ariaLabel()"
  xmlns="http://www.w3.org/2000/svg"
  [class.is-static]="!animated()"
  [attr.data-pose]="pose()"
>
  <defs>
    <radialGradient [attr.id]="uid + '-glow'">
      <stop offset="0%" stop-color="#C9A6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <clipPath [attr.id]="uid + '-helmet'">
      <rect x="24" y="12" width="72" height="66" rx="30" />
    </clipPath>
  </defs>

  @if (hasBody()) {
    <ellipse class="shadow" cx="60" cy="134" rx="26" ry="4" fill="#000" opacity="0.28" />
  }

  @if (pose() === 'celebrating') {
    <g class="sparkles" fill="#FBBF24">
      <path d="M12 30l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" />
      <path d="M106 20l2 4.8 4.8 2-4.8 2-2 4.8-2-4.8-4.8-2 4.8-2z" />
      <circle cx="110" cy="62" r="2.5" />
      <circle cx="8" cy="70" r="2" />
    </g>
  }
  @if (pose() === 'thinking') {
    <g class="thought" fill="#A4A4A4">
      <circle cx="100" cy="16" r="3" />
      <circle cx="108" cy="8" r="4" />
      <circle cx="116" cy="0" r="4.5" opacity="0.8" />
    </g>
  }

  <g class="bot">
    @if (hasBody()) {
      <!-- Legs and boots -->
      <rect x="46" y="110" width="11" height="16" rx="4" fill="#CFC9EF" />
      <rect x="63" y="110" width="11" height="16" rx="4" fill="#CFC9EF" />
      <rect x="42" y="122" width="17" height="9" rx="4.5" fill="#3B3561" />
      <rect x="61" y="122" width="17" height="9" rx="4.5" fill="#3B3561" />

      <!-- Arms rotate from the shoulder -->
      <g class="arm arm-left">
        <rect x="27" y="84" width="12" height="24" rx="6" fill="#F4F2FC" />
        <rect x="27" y="97" width="12" height="4" fill="#CFC9EF" />
        <circle cx="33" cy="110" r="6.5" fill="#5B5585" />
      </g>
      <g class="arm arm-right">
        <rect x="81" y="84" width="12" height="24" rx="6" fill="#F4F2FC" />
        <rect x="81" y="97" width="12" height="4" fill="#CFC9EF" />
        <circle cx="87" cy="110" r="6.5" fill="#5B5585" />
      </g>

      <!-- Neck and torso with a glowing core -->
      <rect x="52" y="74" width="16" height="10" rx="3" fill="#5B5585" />
      <rect x="38" y="80" width="44" height="36" rx="14" fill="#F4F2FC" />
      <path d="M38 102h44a14 14 0 0 1-14 14H52a14 14 0 0 1-14-14z" fill="#CFC9EF" />
      <rect x="48" y="87" width="24" height="14" rx="5" fill="#17142B" />
      <circle class="core" cx="60" cy="94" r="3.5" fill="#B98CFF" />
      <rect x="64" y="91" width="5" height="2" rx="1" fill="#7FD4FF" opacity="0.8" />
      <rect x="64" y="95" width="3" height="2" rx="1" fill="#7FD4FF" opacity="0.5" />
    }

    <!-- Head turns around the neck joint -->
    <g class="head">
      <rect class="led-stem" x="56" y="6" width="8" height="10" rx="3" fill="#CFC9EF" />
      <rect class="led" x="55" y="1" width="10" height="7" rx="3.5" fill="#7FD4FF" />

      <rect x="24" y="12" width="72" height="66" rx="30" fill="#F4F2FC" />
      <g [attr.clip-path]="'url(#' + uid + '-helmet)'">
        <rect x="20" y="64" width="80" height="20" fill="#CFC9EF" />
        <ellipse cx="44" cy="22" rx="13" ry="6" fill="#FFFFFF" opacity="0.8" />
      </g>

      <!-- Visor and eyes -->
      <rect x="33" y="29" width="54" height="37" rx="15" fill="#17142B" />
      <rect x="38" y="32" width="16" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.14" />
      <g class="eyes">
        <ellipse cx="49" cy="48" rx="10" ry="13" [attr.fill]="'url(#' + uid + '-glow)'" />
        <ellipse cx="71" cy="48" rx="10" ry="13" [attr.fill]="'url(#' + uid + '-glow)'" />
        @if (happyEyes()) {
          <g stroke="#E2CCFF" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M44 51q5-8 10 0" />
            <path d="M66 51q5-8 10 0" />
          </g>
        } @else {
          <rect class="eye" x="45" y="40" width="8" height="16" rx="4" fill="#C9A6FF" />
          <rect class="eye" x="67" y="40" width="8" height="16" rx="4" fill="#C9A6FF" />
          <rect x="47" y="42" width="2.5" height="5" rx="1.25" fill="#FFFFFF" opacity="0.85" />
          <rect x="69" y="42" width="2.5" height="5" rx="1.25" fill="#FFFFFF" opacity="0.85" />
        }
      </g>

      <!-- Headphone cups -->
      <circle cx="24" cy="47" r="11.5" fill="#F4F2FC" stroke="#CFC9EF" stroke-width="3" />
      <circle class="ear" cx="24" cy="47" r="5.5" fill="#7FD4FF" />
      <circle cx="96" cy="47" r="11.5" fill="#F4F2FC" stroke="#CFC9EF" stroke-width="3" />
      <circle class="ear" cx="96" cy="47" r="5.5" fill="#7FD4FF" />
    </g>

    @if (pose() === 'peeking') {
      <!-- Hands gripping the edge below the head -->
      <g class="hands">
        <rect x="14" y="70" width="24" height="15" rx="7.5" fill="#F4F2FC" />
        <path
          d="M20 79v5M26 79v5M32 79v5"
          stroke="#CFC9EF"
          stroke-width="2"
          stroke-linecap="round"
        />
        <rect x="82" y="70" width="24" height="15" rx="7.5" fill="#F4F2FC" />
        <path
          d="M88 79v5M94 79v5M100 79v5"
          stroke="#CFC9EF"
          stroke-width="2"
          stroke-linecap="round"
        />
      </g>
    }
  </g>
</svg>
