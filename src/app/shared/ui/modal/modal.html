<div class="backdrop" aria-hidden="true" (click)="closed.emit()"></div>
<div
  role="dialog"
  aria-modal="true"
  class="card"
  [attr.data-width]="width()"
  [attr.aria-labelledby]="headingId"
>
  <header class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h2 [id]="headingId" class="font-display text-xl font-bold">{{ heading() }}</h2>
      @if (subheading()) {
        <p class="mt-0.5 text-sm text-muted">{{ subheading() }}</p>
      }
    </div>
    <button type="button" class="close" aria-label="Close" (click)="closed.emit()">
      <app-icon name="x" [size]="18" />
    </button>
  </header>

  <div class="body"><ng-content /></div>

  <footer class="footer"><ng-content select="[footer]" /></footer>
</div>
