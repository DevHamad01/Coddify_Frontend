@if (mode() === 'compact') {
  <button
    type="button"
    class="flex h-10 w-10 items-center justify-center rounded-btn border border-border bg-surface text-text transition-colors duration-hover hover:bg-surface-2"
    [attr.aria-label]="'Theme: ' + current().label + '. Switch theme'"
    [attr.title]="'Theme: ' + current().label"
    (click)="theme.cycle()"
  >
    <app-icon [name]="current().icon" [size]="18" />
  </button>
} @else {
  <div
    role="radiogroup"
    aria-label="Theme"
    class="inline-flex rounded-btn border border-border bg-surface-2 p-1"
  >
    @for (option of options; track option.value) {
      <button
        type="button"
        role="radio"
        class="flex h-9 items-center gap-1.5 rounded-lg px-3 text-sm font-medium transition-colors duration-hover"
        [class]="
          theme.preference() === option.value
            ? 'bg-surface text-text shadow-sm'
            : 'text-muted hover:text-text'
        "
        [attr.aria-checked]="theme.preference() === option.value"
        (click)="theme.setPreference(option.value)"
      >
        <app-icon [name]="option.icon" [size]="16" />
        {{ option.label }}
      </button>
    }
  </div>
}
